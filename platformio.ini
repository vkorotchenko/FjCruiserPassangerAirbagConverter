; FJ Cruiser passenger-airbag converter - single firmware on the Adafruit
; Feather ESP32-S2. The ESP32-S2 runs the converter AND hosts the web UI directly
; (WiFi + WebSocket in-process), so there is no separate bridge board or UART.
; The S2 is WiFi-only (no Bluetooth radio); nothing in the firmware uses BT.
;
;   Browser (phone/PC)  <--WiFi: HTTP + WebSocket-->  Feather ESP32-S2 (converter + web host)
;
; Build/upload:
;   pio run -t upload                 # firmware
;   scripts/build_web.sh
;   pio run -t uploadfs               # web UI -> LittleFS

[platformio]
; The ESP32 LittleFS image is built from data_esp/ (gzipped SPA), keeping the
; project's data/ protocol DB out of the firmware filesystem.
data_dir = data_esp

[env:adafruit_feather_esp32s2]
platform = espressif32
board = adafruit_feather_esp32s2
framework = arduino

monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

build_flags =
    -I include

lib_deps =
    bblanchon/ArduinoJson@^7
    esp32async/ESPAsyncWebServer@^3.6.0
    esp32async/AsyncTCP@^3.3.2
    https://github.com/iwanders/OBD9141
    https://github.com/RobTillaart/X9C10X
