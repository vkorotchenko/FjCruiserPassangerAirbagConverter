# Mobile app release pipeline.
# Triggered by pushing a tag matching `mobile-v*` (e.g. `mobile-v0.1.0`).
# Builds a signed Android APK and publishes a GitHub Release containing
# `fj-ocs-setup-<version>.apk` plus a SHA256 checksum file. The in-app updater
# (mobile/src/services/mobileUpdateController.ts) consumes those assets.

name: Mobile App Release

on:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: |
          cd mobile
          npm ci

      - name: Derive versionName and versionCode from tag
        # Strip the `mobile-v` prefix, reject prerelease tags, and compute a
        # monotonic versionCode using MAJOR*10000 + MINOR*100 + PATCH.
        run: |
          VERSION="${GITHUB_REF_NAME#mobile-v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease tags not supported"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "version must be MAJOR.MINOR.PATCH (got: $VERSION)"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "Resolved versionName=${VERSION} versionCode=${VERSION_CODE}"

      - name: Build signed release APK
        # Signed by build.gradle's signingConfigs.debug (committed debug.keystore)
        # so local and CI builds share one signature, enabling sideloaded OTA
        # updates without reinstalling. NOT Play Store eligible — sideload only.
        run: |
          cd mobile/android
          ./gradlew :app:assembleRelease \
            -PversionName="${VERSION}" \
            -PversionCode="${VERSION_CODE}" \
            --no-daemon

      - name: Stage release artifacts
        # build.gradle names the APK `FjOcsSetup-<versionName>.apk`. Rename to the
        # canonical release filename and write a SHA256 sidecar (`<hex>  <file>`
        # so `sha256sum -c` works from dist/).
        run: |
          mkdir -p dist
          APK_SRC=$(find mobile/android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "No APK found in release output dir."
            ls -la mobile/android/app/build/outputs/apk/release || true
            exit 1
          fi
          APK_DST="dist/fj-ocs-setup-${VERSION}.apk"
          cp "$APK_SRC" "$APK_DST"
          ( cd dist && sha256sum "fj-ocs-setup-${VERSION}.apk" > "fj-ocs-setup-${VERSION}.apk.sha256" )
          ls -lh "$APK_DST" "${APK_DST}.sha256"

      - name: Write build summary
        run: |
          APK="dist/fj-ocs-setup-${VERSION}.apk"
          SIZE_BYTES=$(stat -c%s "$APK")
          SIZE_MB=$(awk "BEGIN { printf \"%.2f\", ${SIZE_BYTES} / 1048576 }")
          DIGEST=$(awk '{print $1}' "${APK}.sha256")
          {
            echo "## FJ OCS Setup ${VERSION}"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| versionName | \`${VERSION}\` |"
            echo "| versionCode | \`${VERSION_CODE}\` |"
            echo "| Tag | \`${GITHUB_REF_NAME}\` |"
            echo "| APK | \`fj-ocs-setup-${VERSION}.apk\` |"
            echo "| Size | ${SIZE_BYTES} bytes (${SIZE_MB} MiB) |"
            echo "| SHA256 | \`${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FJ OCS Setup ${{ env.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/fj-ocs-setup-${{ env.VERSION }}.apk
            dist/fj-ocs-setup-${{ env.VERSION }}.apk.sha256
